<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <title>Delia & Juan · ¡Nos casamos!</title>
    <meta name="description" content="Viernes 20 de noviembre de 2026 · Salón de eventos Dayder" />

    <!-- PWA y Mobile -->
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Preload crítico para performance -->
    <link rel="preload" as="script" href="https://www.youtube.com/iframe_api" />
  </head>
